# 推送到 main 就自动构建并部署到 WDL。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配一个 secret：
#   ADMIN_TOKEN   WDL 控制面的租户 token
# WDL_NS 和 CONTROL_URL 不是敏感信息，直接写在下面。
#
# 正文内容不在本仓库，而在 leafan2026/open-doc（公开仓库），
# site.json 和 public/img 都是构建产物、不进版本控制，所以每次部署都要重新生成。

name: 部署到 WDL

on:
  push:
    branches: [main]

# 同一时刻只允许一个部署在跑，避免两次推送互相覆盖
concurrency:
  group: deploy-wdl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取本仓库
        uses: actions/checkout@v4

      - name: 取文档内容源
        uses: actions/checkout@v4
        with:
          repository: leafan2026/open-doc
          ref: master
          path: open-doc

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 装依赖
        run: npm ci

      # 产出 src/data/site.json 与 public/img/**
      - name: 生成站点数据
        run: npm run data -- ./open-doc

      - name: 部署
        env:
          WDL_NS: lf
          CONTROL_URL: https://admin-run.jinapp.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: npx wdl deploy .
